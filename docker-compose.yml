services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rag_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: ankane/pgvector
    container_name: rag_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    container_name: rag_redis
    restart: always
    env_file:
      - .env
    ports:
      - "6379:6379"
  
  celery:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rag_celery
    command: uv run celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres

volumes:
  postgres_data: